    <style>
      /* Écran d'attente affiché avant même le code du jeu */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14110e;
      }
      #attente {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        color: #f3e9d6;
        font: 600 2rem/1.1 system-ui, sans-serif;
      }
      #attente i {
        display: block;
        width: 160px;
        height: 4px;
        margin: 0 auto;
        border-radius: 4px;
        background: linear-gradient(90deg, transparent, #d9a54a, transparent) 0 0 / 50% 100% no-repeat rgba(255, 255, 255, 0.12);
        animation: attente 1.1s linear infinite;
      }
      @keyframes attente {
        from {
          background-position: -100% 0;
        }
        to {
          background-position: 200% 0;
        }
      }
    </style>
  </head>
